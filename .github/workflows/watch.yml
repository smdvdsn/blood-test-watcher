name: Watch for blood test slots

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Remembers which slots were already notified, so you get one alert per slot.
      - uses: actions/cache/restore@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check for slots
        env:
          BOOKING_URLS: ${{ secrets.BOOKING_URLS }}   # optional; overrides urls.txt
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python watcher.py --once --debug

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug
          path: debug/
          retention-days: 2
